name: diagrams

# The mermaid-cli image is about 1 GB, so this runs only when something the
# rendered SVGs depend on changes.
on:
  push:
    branches: ["**"]
    paths:
      - docs/*.mmd
      - docs/*.svg
      - Makefile
      - .github/workflows/diagrams.yml
  pull_request:
    paths:
      - docs/*.mmd
      - docs/*.svg
      - Makefile
      - .github/workflows/diagrams.yml

permissions:
  contents: read

# prettier-ignore
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  diagrams:
    name: diagrams
    runs-on: ubuntu-24.04
    # mermaid-cli's headless Chromium can hang instead of failing.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # --intent-to-add lets the diff see SVGs for a diagram that has none
      # committed yet.
      - name: Check that the committed diagrams are current
        run: |
          make diagrams
          git add --intent-to-add -- docs
          git diff --exit-code --stat -- docs
