name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# prettier-ignore
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make coverage

  test-windows:
    name: test (windows)
    runs-on: windows-2025
    defaults:
      run:
        # Git Bash keeps pipefail on, so exit codes survive pipes; pwsh's do not.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The image ships Git Bash but not GNU make.
      - run: choco install make --no-progress --yes
      - run: make coverage

  build:
    name: build
    needs: [lint, test, test-windows]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The gitcalver version counts the commits made on HEAD's UTC date.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Check that the committed resource file is current
        run: make winres && git diff --exit-code -- cmd/mink-lasso
      - run: make package
      - id: version
        # A bare assignment, unlike an argument to echo, fails the step if
        # make does.
        run: |
          version=$(make --silent version)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mink-lasso
          path: dist/mink-lasso.zip

  release:
    name: release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      # This job publishes the ZIP the build job made rather than building
      # it again: `make package` runs go-winres, and this job runs nothing but
      # download-artifact and the gh CLI, so no build, lint, or test
      # dependency sees the elevated token.
      contents: write # creates the release and its tag
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mink-lasso
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v0.$VERSION" --repo "$REPO" --target "$SHA" \
            --title "$VERSION" --generate-notes dist/mink-lasso.zip
