name: integration

# Runs the integration suite against the real controller from the self-hosted
# runner on the shop LAN. Started by hand; see README.md for the runner setup.
on:
  workflow_dispatch:
    inputs:
      serial:
        description:
          Controller serial (G3-xxxxx); defaults to the MASSO_SERIAL repository
          variable
        required: false
        type: string

permissions:
  contents: read

# Only one client may talk to the controller at a time.
concurrency:
  group: masso-controller
  cancel-in-progress: false

jobs:
  integration:
    name: integration
    runs-on: [self-hosted, windows, masso]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      MINK_LASSO_SERIAL: ${{ inputs.serial || vars.MASSO_SERIAL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Stop any instance left over from a previous run
        run: taskkill //IM mink-lasso.exe //F || true
      - run: make integration 2>&1 | tee integration.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-log
          path: integration.log
